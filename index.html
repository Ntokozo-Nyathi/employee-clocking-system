
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<title>Employee Clocking System</title>

</head>

<body>

<h1>Employee Clocking System</h1>

<h2 id="clock">00:00:00</h2>

<p id="date"></p>

<hr>

<h2>Employee</h2>

<label for="employee">Employee Name / ID</label>

<br>

<input
    type="text"
    id="employee"
    placeholder="Enter employee name or ID"
    autocomplete="username"
>

<br><br>

<p>
    🔐 <strong>Biometric security:</strong>
    Your device handles fingerprint, Face ID,
    Touch ID or passkey authentication.
</p>

<p>
    📍 <strong>Location:</strong>
    GPS location will be requested when you clock in or out.
</p>

<br>

<button
    id="registerBtn"
    onclick="registerBiometric()">

    🔐 Register Fingerprint / Face ID

</button>

<br><br>

<button
    id="clockInBtn"
    onclick="clockIn()">

    🟢 Clock In with Biometrics + GPS

</button>

<br><br>

<button
    id="clockOutBtn"
    onclick="clockOut()">

    🔴 Clock Out with Biometrics + GPS

</button>

<br><br>

<button
    onclick="openCamera()">

    📷 Open Camera

</button>

<br><br>

<div id="cameraSection" style="display:none;">

    <h3>📸 Clock-in Photo</h3>

    <video
        id="camera"
        autoplay
        playsinline
        width="100%">
    </video>

    <br><br>

    <button
        onclick="takeClockInPhoto()">

        📸 Take Clock-in Photo

    </button>

    <canvas
        id="photoCanvas"
        style="display:none;">
    </canvas>

    <br>

    <img
        id="photoPreview"
        style="display:none; width:100%;"
        alt="Clock-in photo">

</div>

<br>

<button
    id="panicBtn"
    onclick="panicButton()">

    🚨 PANIC / SOS

</button>

<div id="status"></div>

<hr>

<h2>Clocking Records</h2>

<div id="records"></div>

<br>

<button
    onclick="clearRecords()">

    🧹 Clear All Records

</button>


<script>

/* =====================================================
   SETTINGS
===================================================== */

const RP_NAME =
    "Employee Clocking System";


/*
   CHANGE THIS NUMBER TO THE SUPERVISOR/
   EMERGENCY NUMBER.
*/

const emergencyNumber =
    "0123456789";


/* =====================================================
   LIVE CLOCK
===================================================== */

function updateClock() {

    const now =
        new Date();

    document.getElementById("clock")
        .textContent =
        now.toLocaleTimeString();

    document.getElementById("date")
        .textContent =
        now.toLocaleDateString(
            undefined,
            {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric"
            }
        );
}


setInterval(
    updateClock,
    1000
);

updateClock();


/* =====================================================
   STATUS MESSAGE
===================================================== */

function showStatus(
    message
) {

    const status =
        document.getElementById(
            "status"
        );

    status.textContent =
        message;

    status.style.display =
        "block";

    setTimeout(
        function() {

            status.style.display =
                "none";

        },
        6000
    );

}


/* =====================================================
   CHECK WEB AUTHN
===================================================== */

function checkWebAuthn() {

    if (!window.PublicKeyCredential) {

        showStatus(
            "This device or browser does not support biometric passkeys."
        );

        return false;

    }


    if (!window.isSecureContext) {

        showStatus(
            "Biometrics require HTTPS. Open your GitHub Pages HTTPS website."
        );

        return false;

    }


    return true;

}


/* =====================================================
   RANDOM CHALLENGE
===================================================== */

function generateChallenge() {

    const challenge =
        new Uint8Array(32);

    crypto.getRandomValues(
        challenge
    );

    return challenge;

}


/* =====================================================
   BASE64URL
===================================================== */

function bufferToBase64url(
    buffer
) {

    const bytes =
        new Uint8Array(
            buffer
        );

    let binary =
        "";

    for (
        const byte of bytes
    ) {

        binary +=
            String.fromCharCode(
                byte
            );

    }

    return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=/g, "");

}


function base64urlToBuffer(
    value
) {

    const padding =
        "=".repeat(
            (4 - value.length % 4) % 4
        );

    const base64 =
        (value + padding)
        .replace(/-/g, "+")
        .replace(/_/g, "/");

    const binary =
        atob(base64);

    const bytes =
        new Uint8Array(
            binary.length
        );

    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);

    }

    return bytes.buffer;

}


/* =====================================================
   GET WEBSITE DOMAIN
===================================================== */

function getRPID() {

    return window.location.hostname;

}


/* =====================================================
   REGISTER BIOMETRIC
===================================================== */

async function registerBiometric() {

    if (!checkWebAuthn()) {

        return;

    }


    const employee =
        document
        .getElementById("employee")
        .value
        .trim();


    if (!employee) {

        showStatus(
            "Enter an employee name or ID first."
        );

        return;

    }


    try {

        showStatus(
            "🔐 Follow the fingerprint / Face ID prompt on your device."
        );


        const challenge =
            generateChallenge();


        /*
           Create a unique ID for the employee.
        */

        let storedUserId =
            localStorage.getItem(
                "userId_" +
                employee.toLowerCase()
            );


        let userId;


        if (storedUserId) {

            userId =
                base64urlToBuffer(
                    storedUserId
                );

        }

        else {

            const randomUserId =
                new Uint8Array(32);

            crypto.getRandomValues(
                randomUserId
            );

            userId =
                randomUserId.buffer;


            localStorage.setItem(

                "userId_" +
                employee.toLowerCase(),

                bufferToBase64url(
                    userId
                )

            );

        }


        /*
           CREATE BIOMETRIC CREDENTIAL
        */

        const credential =
            await navigator.credentials.create({

                publicKey: {

                    challenge:
                        challenge,

                    rp: {

                        name:
                            RP_NAME,

                        id:
                            getRPID()

                    },

                    user: {

                        id:
                            userId,

                        name:
                            employee,

                        displayName:
                            employee

                    },

                    pubKeyCredParams: [

                        {
                            type:
                                "public-key",

                            alg:
                                -7
                        },

                        {
                            type:
                                "public-key",

                            alg:
                                -257
                        }

                    ],

                    authenticatorSelection: {

                        residentKey:
                            "preferred",

                        userVerification:
                            "required"

                    },

                    timeout:
                        60000,

                    attestation:
                        "none"

                }

            });


        if (!credential) {

            throw new Error(
                "Biometric registration failed."
            );

        }


        /*
           SAVE CREDENTIAL INFORMATION
        */

        const data = {

            id:
                credential.id,

            rawId:
                bufferToBase64url(
                    credential.rawId
                ),

            employee:
                employee,

            registeredAt:
                new Date().toISOString()

        };


        localStorage.setItem(

            "biometric_" +
            employee.toLowerCase(),

            JSON.stringify(data)

        );


        showStatus(

            "✅ Biometric successfully registered for " +
            employee

        );

    }


    catch (error) {

        console.error(
            error
        );

        showStatus(

            "❌ Biometric registration failed or was cancelled."

        );

    }

}


/* =====================================================
   GET REGISTERED BIOMETRIC
===================================================== */

function getCredential(
    employee
) {

    const data =
        localStorage.getItem(

            "biometric_" +
            employee.toLowerCase()

        );


    if (!data) {

        return null;

    }


    try {

        return JSON.parse(
            data
        );

    }

    catch {

        return null;

    }

}


/* =====================================================
   BIOMETRIC AUTHENTICATION
===================================================== */

async function authenticateBiometric(
    employee
) {

    const registered =
        getCredential(
            employee
        );


    if (!registered) {

        showStatus(

            "❌ No biometric is registered for " +
            employee +
            ". Register the employee first."

        );

        return false;

    }


    try {

        showStatus(

            "🔐 Waiting for fingerprint / Face ID..."

        );


        const challenge =
            generateChallenge();


        const assertion =
            await navigator.credentials.get({

                publicKey: {

                    challenge:
                        challenge,

                    rpId:
                        getRPID(),

                    allowCredentials: [

                        {

                            type:
                                "public-key",

                            id:
                                base64urlToBuffer(
                                    registered.rawId
                                )

                        }

                    ],

                    userVerification:
                        "required",

                    timeout:
                        60000

                }

            });


        if (!assertion) {

            return false;

        }


        showStatus(

            "✅ Biometric authentication successful."

        );


        return true;

    }


    catch (error) {

        console.error(
            error
        );

        showStatus(

            "❌ Biometric authentication failed or was cancelled."

        );

        return false;

    }

}


/* =====================================================
   GPS LOCATION
===================================================== */

function getLocation() {

    return new Promise(
        function(
            resolve,
            reject
        ) {

            if (!navigator.geolocation) {

                reject(
                    new Error(
                        "GPS is not supported."
                    )
                );

                return;

            }


            showStatus(
                "📍 Getting your GPS location..."
            );


            navigator.geolocation.getCurrentPosition(

                function(position) {

                    resolve({

                        latitude:
                            position.coords.latitude,

                        longitude:
                            position.coords.longitude,

                        accuracy:
                            position.coords.accuracy

                    });

                },


                function(error) {

                    let message =
                        "Unable to get GPS location.";


                    if (
                        error.code ===
                        error.PERMISSION_DENIED
                    ) {

                        message =
                            "Location permission was denied.";

                    }


                    else if (
                        error.code ===
                        error.POSITION_UNAVAILABLE
                    ) {

                        message =
                            "Location is unavailable.";

                    }


                    else if (
                        error.code ===
                        error.TIMEOUT
                    ) {

                        message =
                            "Location request timed out.";

                    }


                    reject(
                        new Error(
                            message
                        )
                    );

                },


                {

                    enableHighAccuracy:
                        true,

                    timeout:
                        15000,

                    maximumAge:
                        0

                }

            );

        }
    );

}


/* =====================================================
   CAMERA
===================================================== */

let cameraStream =
    null;


let clockInPhoto =
    null;


/* =====================================================
   OPEN CAMERA
===================================================== */

async function openCamera() {

    try {

        if (!navigator.mediaDevices) {

            showStatus(
                "Camera is not supported."
            );

            return;

        }


        const video =
            document.getElementById(
                "camera"
            );


        cameraStream =
            await navigator.mediaDevices
            .getUserMedia({

                video: {

                    facingMode:
                        "user"

                },

                audio:
                    false

            });


        video.srcObject =
            cameraStream;


        document.getElementById(
            "cameraSection"
        ).style.display =
            "block";


        showStatus(
            "📷 Camera opened."
        );

    }


    catch (error) {

        console.error(
            error
        );

        showStatus(

            "❌ Camera permission was denied or the camera is unavailable."

        );

    }

}


/* =====================================================
   TAKE PHOTO
===================================================== */

function takeClockInPhoto() {

    const video =
        document.getElementById(
            "camera"
        );


    const canvas =
        document.getElementById(
            "photoCanvas"
        );


    const preview =
        document.getElementById(
            "photoPreview"
        );


    if (!video.videoWidth) {

        showStatus(
            "Camera is not ready."
        );

        return;

    }


    canvas.width =
        video.videoWidth;


    canvas.height =
        video.videoHeight;


    const context =
        canvas.getContext(
            "2d"
        );


    context.drawImage(

        video,

        0,

        0,

        canvas.width,

        canvas.height

    );


    clockInPhoto =
        canvas.toDataURL(
            "image/jpeg",
            0.8
        );


    preview.src =
        clockInPhoto;


    preview.style.display =
        "block";


    showStatus(
        "📸 Photo captured."
    );

}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera() {

    if (cameraStream) {

        cameraStream
        .getTracks()
        .forEach(
            function(track) {

                track.stop();

            }
        );


        cameraStream =
            null;

    }

}


/* =====================================================
   CLOCK IN
===================================================== */

async function clockIn() {

    const employee =
        document
        .getElementById(
            "employee"
        )
        .value
        .trim();


    if (!employee) {

        showStatus(
            "Enter an employee name or ID."
        );

        return;

    }


    const records =
        getRecords();


    /*
       CHECK WHETHER EMPLOYEE IS ALREADY
       CLOCKED IN.
    */

    const alreadyClockedIn =
        records.some(
            function(record) {

                return (

                    record.employee
                    .toLowerCase() ===
                    employee.toLowerCase()

                    &&

                    record.clockOut ===
                    null

                );

            }
        );


    if (alreadyClockedIn) {

        showStatus(

            employee +
            " is already clocked in."

        );

        return;

    }


    /*
       BIOMETRIC VERIFICATION
    */

    const authenticated =
        await authenticateBiometric(
            employee
        );


    if (!authenticated) {

        return;

    }


    /*
       GET LOCATION
    */

    let location;


    try {

        location =
            await getLocation();

    }


    catch (error) {

        showStatus(
            error.message
        );

        return;

    }


    /*
       CREATE RECORD
    */

    const now =
        new Date();


    records.push({

        id:
            Date.now(),

        employee:
            employee,

        date:
            now.toLocaleDateString(),

        clockIn:
            now.toLocaleTimeString(),

        clockOut:
            null,

        clockInLocation:
            location,

        clockOutLocation:
            null,

        authentication:
            "Biometric",

        clockInPhoto:
            clockInPhoto || null

    });


    saveRecords(
        records
    );


    displayRecords();


    showStatus(

        "🟢 Clock-in successful! Biometric and GPS verified."

    );


    stopCamera();

}


/* =====================================================
   CLOCK OUT
===================================================== */

async function clockOut() {

    const employee =
        document
        .getElementById(
            "employee"
        )
        .value
        .trim();


    if (!employee) {

        showStatus(
            "Enter an employee name or ID."
        );

        return;

    }


    const records =
        getRecords();


    let record =
        null;


    /*
       FIND ACTIVE CLOCK-IN
    */

    for (
        let i = records.length - 1;
        i >= 0;
        i--
    ) {

        if (

            records[i]
            .employee
            .toLowerCase() ===
            employee
            .toLowerCase()

            &&

            records[i]
            .clockOut ===
            null

        ) {

            record =
                records[i];

            break;

        }

    }


    if (!record) {

        showStatus(

            employee +
            " is not currently clocked in."

        );

        return;

    }


    /*
       BIOMETRIC
    */

    const authenticated =
        await authenticateBiometric(
            employee
        );


    if (!authenticated) {

        return;

    }


    /*
       GPS
    */

    let location;


    try {

        location =
            await getLocation();

    }


    catch (error) {

        showStatus(
            error.message
        );

        return;

    }


    /*
       CLOCK OUT
    */

    const now =
        new Date();


    record.clockOut =
        now.toLocaleTimeString();


    record.clockOutLocation =
        location;


    saveRecords(
        records
    );


    displayRecords();


    showStatus(

        "🔴 Clock-out successful! Biometric and GPS verified."

    );

}


/* =====================================================
   RECORD STORAGE
===================================================== */

function getRecords() {

    try {

        return JSON.parse(

            localStorage.getItem(
                "clockingRecords"
            )

        ) || [];

    }

    catch {

        return [];

    }

}


function saveRecords(
    records
) {

    localStorage.setItem(

        "clockingRecords",

        JSON.stringify(
            records
        )

    );

}


/* =====================================================
   GOOGLE MAPS
===================================================== */

function googleMapsURL(
    latitude,
    longitude
) {

    return (

        "https://www.google.com/maps/search/?api=1&query="
        +
        encodeURIComponent(
            latitude +
            "," +
            longitude
        )

    );

}


/* =====================================================
   OPEN STREET MAP
===================================================== */

function openStreetMapURL(
    latitude,
    longitude
) {

    return (

        "https://www.openstreetmap.org/?mlat="
        +
        encodeURIComponent(
            latitude
        )
        +
        "&mlon="
        +
        encodeURIComponent(
            longitude
        )
        +
        "#map=18/"
        +
        encodeURIComponent(
            latitude
        )
        +
        "/"
        +
        encodeURIComponent(
            longitude
        )

    );

}


/* =====================================================
   LOCATION DISPLAY
===================================================== */

function locationHTML(
    location,
    title
) {

    if (!location) {

        return "";

    }


    const latitude =
        Number(
            location.latitude
        ).toFixed(6);


    const longitude =
        Number(
            location.longitude
        ).toFixed(6);


    const accuracy =
        Math.round(
            Number(
                location.accuracy
            )
        );


    return `

        <div>

            <strong>
                📍 ${title}
            </strong>

            <br>

            Latitude:
            ${latitude}

            <br>

            Longitude:
            ${longitude}

            <br>

            GPS Accuracy:
            approximately
            ${accuracy}
            metres

            <br><br>

            <a
                href="${googleMapsURL(
                    location.latitude,
                    location.longitude
                )}"
                target="_blank"
                rel="noopener">

                🗺️ Google Maps

            </a>

            &nbsp;&nbsp;

            <a
                href="${openStreetMapURL(
                    location.latitude,
                    location.longitude
                )}"
                target="_blank"
                rel="noopener">

                🗺️ OpenStreetMap

            </a>

        </div>

    `;

}


/* =====================================================
   DISPLAY RECORDS
===================================================== */

function displayRecords() {

    const records =
        getRecords();


    const container =
        document.getElementById(
            "records"
        );


    container.innerHTML =
        "";


    if (records.length === 0) {

        container.innerHTML =
            "<p>No clocking records yet.</p>";

        return;

    }


    const reversed =
        [...records].reverse();


    reversed.forEach(
        function(record) {

            const div =
                document.createElement(
                    "div"
                );


            div.innerHTML = `

                <hr>

                <p>

                    <strong>
                        Employee:
                    </strong>

                    ${escapeHTML(
                        record.employee
                    )}

                </p>


                <p>

                    <strong>
                        Date:
                    </strong>

                    ${escapeHTML(
                        record.date
                    )}

                </p>


                <p>

                    <strong>
                        Authentication:
                    </strong>

                    🔐 ${escapeHTML(
                        record.authentication ||
                        "Biometric"
                    )}

                </p>


                <p>

                    <strong>
                        Clock In:
                    </strong>

                    ${escapeHTML(
                        record.clockIn
                    )}

                </p>


                ${locationHTML(
                    record.clockInLocation,
                    "Clock-in location"
                )}


                <p>

                    <strong>
                        Clock Out:
                    </strong>

                    ${
                        record.clockOut
                        ?
                        escapeHTML(
                            record.clockOut
                        )
                        :
                        "Still clocked in"
                    }

                </p>


                ${locationHTML(
                    record.clockOutLocation,
                    "Clock-out location"
                )}

            `;


            /*
               DISPLAY PHOTO
            */

            if (
                record.clockInPhoto
            ) {

                const photo =
                    document.createElement(
                        "img"
                    );


                photo.src =
                    record.clockInPhoto;


                photo.style.width =
                    "100%";


                photo.style.maxWidth =
                    "500px";


                photo.alt =
                    "Clock-in photo";


                div.appendChild(
                    photo
                );

            }


            container.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   CLEAR RECORDS
===================================================== */

function clearRecords() {

    const answer =
        confirm(

            "Are you sure you want to delete all clocking records?"

        );


    if (!answer) {

        return;

    }


    localStorage.removeItem(
        "clockingRecords"
    );


    displayRecords();


    showStatus(
        "All records have been deleted."
    );

}


/* =====================================================
   PANIC BUTTON
===================================================== */

function panicButton() {

    const employee =
        document
        .getElementById(
            "employee"
        )
        .value
        .trim();


    if (!employee) {

        showStatus(
            "Enter the employee name or ID first."
        );

        return;

    }


    const confirmed =
        confirm(

            "Are you sure you want to activate the emergency alert?"

        );


    if (!confirmed) {

        return;

    }


    const message =
        "EMERGENCY ALERT: Employee " +
        employee +
        " has activated the PANIC/SOS button.";


    const smsURL =
        "sms:" +
        emergencyNumber +
        "?body=" +
        encodeURIComponent(
            message
        );


    window.location.href =
        smsURL;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/* =====================================================
   START SYSTEM
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        displayRecords();

    }
);

</script>
</body>
</html>
