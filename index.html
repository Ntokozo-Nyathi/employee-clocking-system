
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<title>Employee Clocking System</title>

</head>

<body>

<h1>Employee Clocking System</h1>

<h2 id="clock">00:00:00</h2>

<p id="date"></p>

<hr>

<h2>Employee</h2>

<label for="employee">Employee Name / ID</label>

<br>

<input
    type="text"
    id="employee"
    placeholder="Enter employee name or ID"
    autocomplete="username"
>

<br><br>

<p>
    🔐 <strong>Biometric security:</strong>
    Your device handles fingerprint, Face ID,
    Touch ID or passkey authentication.
</p>

<p>
    📍 <strong>Location:</strong>
    GPS location will be requested when you clock in or out.
</p>

<br>

<button
    id="registerBtn"
    onclick="registerBiometric()">

    🔐 Register Fingerprint / Face ID

</button>

<br><br>

<button id="clockInBtn" type="button">
    📸 Clock In
</button>

<br><br>

<button
    id="clockOutBtn"
    onclick="clockOut()">

    🔴 Clock Out with Biometrics + GPS

</button>

<br><br>

<button
    onclick="openCamera()">

    📷 Open Camera

</button>

<br><br>

<div id="cameraSection" style="display:none;">

    <h3>📸 Clock-in Photo</h3>

    <video
        id="camera"
        autoplay
        playsinline
        width="100%">
    </video>

    <br><br>

    <button
        onclick="takeClockInPhoto()">

        📸 Take Clock-in Photo

    </button>

    <canvas
        id="photoCanvas"
        style="display:none;">
    </canvas>

    <br>

    <img
        id="photoPreview"
        style="display:none; width:100%;"
        alt="Clock-in photo">

</div>

<br>

<button
    id="panicBtn"
    onclick="panicButton()">

    🚨 PANIC / SOS

</button>

<div id="status"></div>

<hr>

<h2>Clocking Records</h2>

<div id="records"></div>

<br>

<button
    onclick="clearRecords()">

    🧹 Clear All Records

</button>

<script src="script.js"></script>
</body>
</html>
